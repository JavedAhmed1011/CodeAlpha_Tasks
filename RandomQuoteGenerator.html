<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuoteFlow — Random Quote Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f3;--surface:#ffffff;--border:#e8e2d9;
  --text:#1a1714;--muted:#8c8580;--subtle:#f0ece4;
  --accent:#c8633a;--accent2:#2d6a4f;--accent3:#1d3557;
  --font-head:'Playfair Display',serif;--font-body:'Outfit',sans-serif;
}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;position:relative;overflow-x:hidden;
}

/* Background pattern */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle at 20% 20%,rgba(200,99,58,0.06) 0%,transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(45,106,79,0.06) 0%,transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(29,53,87,0.03) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

.wrapper{position:relative;z-index:1;width:100%;max-width:780px}

/* Header */
.header{text-align:center;margin-bottom:3rem;animation:fadeDown 0.8s ease both}
.logo{font-family:var(--font-head);font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:0.25em;text-transform:uppercase;margin-bottom:0.5rem}
.tagline{font-size:0.8rem;color:var(--muted);font-weight:300;letter-spacing:0.1em}

/* Quote Card */
.quote-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:3.5rem 4rem;
  position:relative;margin-bottom:2rem;
  box-shadow:0 2px 40px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  animation:fadeUp 0.8s ease 0.2s both;
  min-height:280px;display:flex;flex-direction:column;justify-content:center;
}

/* Decorative quote mark */
.quote-card::before{
  content:'\201C';font-family:var(--font-head);font-size:8rem;
  color:rgba(200,99,58,0.1);position:absolute;top:-1rem;left:2.5rem;
  line-height:1;pointer-events:none;
}

/* Category pill */
.category-pill{
  display:inline-block;font-size:0.7rem;font-weight:600;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:0.3rem 0.85rem;border-radius:2px;margin-bottom:1.5rem;
  transition:all 0.4s ease;
}
.cat-wisdom{background:rgba(200,99,58,0.1);color:var(--accent)}
.cat-motivation{background:rgba(45,106,79,0.1);color:var(--accent2)}
.cat-life{background:rgba(29,53,87,0.1);color:var(--accent3)}
.cat-success{background:rgba(107,70,193,0.1);color:#6b46c1}
.cat-happiness{background:rgba(214,158,46,0.1);color:#c07d0a}
.cat-courage{background:rgba(197,48,48,0.1);color:#c53030}

/* Quote text */
.quote-text{
  font-family:var(--font-head);font-size:1.65rem;font-weight:400;
  line-height:1.55;color:var(--text);margin-bottom:2rem;
  font-style:italic;transition:opacity 0.4s ease,transform 0.4s ease;
}
.quote-text.hidden{opacity:0;transform:translateY(12px)}

/* Author */
.quote-author{
  display:flex;align-items:center;gap:1rem;
  transition:opacity 0.4s ease;
}
.author-line{width:32px;height:1px;background:var(--muted)}
.author-info{}
.author-name{font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--text)}
.author-desc{font-size:0.75rem;color:var(--muted);font-weight:300;margin-top:0.1rem}

/* Quote number */
.quote-number{
  position:absolute;top:1.5rem;right:2rem;
  font-size:0.7rem;color:var(--muted);font-weight:300;letter-spacing:0.1em;
}

/* Actions */
.actions{
  display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
  animation:fadeUp 0.8s ease 0.4s both;
}

.btn-new{
  background:var(--text);color:var(--bg);
  border:none;font-family:var(--font-body);font-size:0.875rem;font-weight:600;
  padding:0.9rem 2.5rem;border-radius:3px;cursor:pointer;
  letter-spacing:0.08em;text-transform:uppercase;
  transition:all 0.25s ease;position:relative;overflow:hidden;
}
.btn-new::after{
  content:'';position:absolute;inset:0;background:rgba(255,255,255,0.1);
  transform:translateX(-100%);transition:transform 0.3s ease;
}
.btn-new:hover::after{transform:translateX(0)}
.btn-new:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.15)}
.btn-new:active{transform:translateY(0)}

.btn-copy,.btn-fav{
  background:var(--subtle);color:var(--text);
  border:1px solid var(--border);font-family:var(--font-body);
  font-size:0.875rem;font-weight:500;padding:0.9rem 1.5rem;
  border-radius:3px;cursor:pointer;transition:all 0.2s ease;
  letter-spacing:0.03em;
}
.btn-copy:hover,.btn-fav:hover{background:var(--border);transform:translateY(-1px)}
.btn-fav.active{background:rgba(200,99,58,0.1);border-color:var(--accent);color:var(--accent)}

/* Progress dots */
.progress-dots{
  display:flex;gap:6px;justify-content:center;margin-top:2rem;
  animation:fadeUp 0.8s ease 0.5s both;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all 0.3s ease;cursor:pointer}
.dot.active{background:var(--accent);width:20px;border-radius:3px}

/* Favorites panel */
.fav-panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:2rem;margin-top:2rem;
  animation:fadeUp 0.4s ease both;display:none;
}
.fav-panel.show{display:block}
.fav-title{font-family:var(--font-head);font-size:1.1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.fav-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.2rem}
.fav-list{display:flex;flex-direction:column;gap:0.75rem;max-height:300px;overflow-y:auto}
.fav-item{padding:0.9rem 1rem;background:var(--subtle);border-radius:3px;font-size:0.85rem;font-family:var(--font-head);font-style:italic;color:var(--text);line-height:1.5;border-left:3px solid var(--accent)}
.fav-item span{display:block;font-style:normal;font-family:var(--font-body);font-size:0.72rem;color:var(--muted);margin-top:0.4rem}
.fav-empty{text-align:center;color:var(--muted);font-size:0.85rem;padding:1rem}

/* Footer */
.footer{text-align:center;margin-top:2.5rem;font-size:0.72rem;color:var(--muted);letter-spacing:0.08em;animation:fadeUp 0.8s ease 0.6s both}

/* Share toast */
.toast{
  position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);font-size:0.8rem;font-weight:500;
  padding:0.7rem 1.5rem;border-radius:3px;z-index:100;
  transition:transform 0.3s ease,opacity 0.3s ease;opacity:0;letter-spacing:0.05em;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Animations */
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.btn-new.loading{pointer-events:none;opacity:0.7}

/* Category filter */
.cat-filter{
  display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;
  margin-bottom:2rem;animation:fadeUp 0.8s ease 0.3s both;
}
.cat-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-family:var(--font-body);font-size:0.72rem;font-weight:500;
  padding:0.35rem 0.9rem;border-radius:2px;cursor:pointer;
  letter-spacing:0.08em;text-transform:uppercase;transition:all 0.2s;
}
.cat-btn:hover,.cat-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}

@media(max-width:600px){
  .quote-card{padding:2.5rem 2rem}
  .quote-text{font-size:1.3rem}
  .quote-card::before{font-size:5rem;left:1.5rem}
  .actions{flex-direction:column;align-items:stretch}
  .btn-new,.btn-copy,.btn-fav{text-align:center}
}
</style>
</head>
<body>

<div class="wrapper">
  <!-- Header -->
  <div class="header">
    <div class="logo">QuoteFlow</div>
    <div class="tagline">Words that inspire & move</div>
  </div>

  <!-- Category Filter -->
  <div class="cat-filter">
    <button class="cat-btn active" onclick="filterCat('all',this)">All</button>
    <button class="cat-btn" onclick="filterCat('Wisdom',this)">Wisdom</button>
    <button class="cat-btn" onclick="filterCat('Motivation',this)">Motivation</button>
    <button class="cat-btn" onclick="filterCat('Life',this)">Life</button>
    <button class="cat-btn" onclick="filterCat('Success',this)">Success</button>
    <button class="cat-btn" onclick="filterCat('Courage',this)">Courage</button>
    <button class="cat-btn" onclick="filterCat('Happiness',this)">Happiness</button>
  </div>

  <!-- Quote Card -->
  <div class="quote-card">
    <div class="quote-number" id="quote-number">01 / 50</div>
    <span class="category-pill cat-wisdom" id="quote-cat">Wisdom</span>
    <div class="quote-text" id="quote-text">The only way to do great work is to love what you do.</div>
    <div class="quote-author">
      <div class="author-line"></div>
      <div class="author-info">
        <div class="author-name" id="author-name">Steve Jobs</div>
        <div class="author-desc" id="author-desc">Co-founder, Apple Inc.</div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-new" onclick="newQuote()" id="btn-new">✦ New Quote</button>
    <button class="btn-copy" onclick="copyQuote()">Copy</button>
    <button class="btn-fav" id="btn-fav" onclick="toggleFav()">♡ Save</button>
    <button class="btn-copy" onclick="toggleFavPanel()">★ Saved (<span id="fav-count">0</span>)</button>
  </div>

  <!-- Progress dots -->
  <div class="progress-dots" id="progress-dots"></div>

  <!-- Favorites Panel -->
  <div class="fav-panel" id="fav-panel">
    <div class="fav-title">
      Saved Quotes
      <button class="fav-close" onclick="toggleFavPanel()">✕</button>
    </div>
    <div class="fav-list" id="fav-list">
      <div class="fav-empty">No saved quotes yet. Hit ♡ to save!</div>
    </div>
  </div>

  <div class="footer">Click "New Quote" to discover more wisdom &nbsp;·&nbsp; <span id="total-count">50</span> quotes available</div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUOTES = [
  {text:"The only way to do great work is to love what you do.",author:"Steve Jobs",desc:"Co-founder, Apple Inc.",cat:"Motivation"},
  {text:"In the middle of every difficulty lies opportunity.",author:"Albert Einstein",desc:"Theoretical Physicist",cat:"Wisdom"},
  {text:"Life is what happens when you're busy making other plans.",author:"John Lennon",desc:"Musician & Artist",cat:"Life"},
  {text:"The future belongs to those who believe in the beauty of their dreams.",author:"Eleanor Roosevelt",desc:"Former US First Lady",cat:"Success"},
  {text:"It is during our darkest moments that we must focus to see the light.",author:"Aristotle",desc:"Greek Philosopher",cat:"Courage"},
  {text:"Spread love everywhere you go. Let no one ever come to you without leaving happier.",author:"Mother Teresa",desc:"Saint & Humanitarian",cat:"Happiness"},
  {text:"When you reach the end of your rope, tie a knot in it and hang on.",author:"Franklin D. Roosevelt",desc:"32nd US President",cat:"Courage"},
  {text:"Always remember that you are absolutely unique. Just like everyone else.",author:"Margaret Mead",desc:"Cultural Anthropologist",cat:"Life"},
  {text:"Do not go where the path may lead, go instead where there is no path and leave a trail.",author:"Ralph Waldo Emerson",desc:"Essayist & Philosopher",cat:"Wisdom"},
  {text:"You will face many defeats in life, but never let yourself be defeated.",author:"Maya Angelou",desc:"Poet & Civil Rights Activist",cat:"Courage"},
  {text:"The greatest glory in living lies not in never falling, but in rising every time we fall.",author:"Nelson Mandela",desc:"Former President of South Africa",cat:"Courage"},
  {text:"In the end, it's not the years in your life that count. It's the life in your years.",author:"Abraham Lincoln",desc:"16th US President",cat:"Life"},
  {text:"Never let the fear of striking out keep you from playing the game.",author:"Babe Ruth",desc:"Baseball Legend",cat:"Motivation"},
  {text:"Life is either a daring adventure or nothing at all.",author:"Helen Keller",desc:"Author & Activist",cat:"Life"},
  {text:"Many of life's failures are people who did not realize how close they were to success when they gave up.",author:"Thomas A. Edison",desc:"Inventor",cat:"Success"},
  {text:"You have brains in your head. You have feet in your shoes. You can steer yourself any direction you choose.",author:"Dr. Seuss",desc:"Author & Illustrator",cat:"Motivation"},
  {text:"If life were predictable it would cease to be life, and be without flavor.",author:"Eleanor Roosevelt",desc:"Former US First Lady",cat:"Life"},
  {text:"If you look at what you have in life, you'll always have more.",author:"Oprah Winfrey",desc:"Media Executive & Philanthropist",cat:"Happiness"},
  {text:"If you set your goals ridiculously high and it's a failure, you will fail above everyone else's success.",author:"James Cameron",desc:"Film Director",cat:"Success"},
  {text:"Life is not measured by the number of breaths we take, but by the moments that take our breath away.",author:"Maya Angelou",desc:"Poet & Civil Rights Activist",cat:"Life"},
  {text:"If you want to live a happy life, tie it to a goal, not to people or things.",author:"Albert Einstein",desc:"Theoretical Physicist",cat:"Happiness"},
  {text:"Never let the fear of striking out keep you from playing the game.",author:"Babe Ruth",desc:"Baseball Legend",cat:"Courage"},
  {text:"Money and success don't change people; they merely amplify what is already there.",author:"Will Smith",desc:"Actor & Producer",cat:"Success"},
  {text:"Your time is limited, so don't waste it living someone else's life.",author:"Steve Jobs",desc:"Co-founder, Apple Inc.",cat:"Wisdom"},
  {text:"Not how long, but how well you have lived is the main thing.",author:"Seneca",desc:"Stoic Philosopher",cat:"Wisdom"},
  {text:"If life is a journey, make sure you are the driver.",author:"Unknown",desc:"Ancient Proverb",cat:"Life"},
  {text:"The secret of getting ahead is getting started.",author:"Mark Twain",desc:"Author & Humorist",cat:"Motivation"},
  {text:"It always seems impossible until it's done.",author:"Nelson Mandela",desc:"Former President of South Africa",cat:"Motivation"},
  {text:"Act as if what you do makes a difference. It does.",author:"William James",desc:"Philosopher & Psychologist",cat:"Motivation"},
  {text:"Success is not final, failure is not fatal: it is the courage to continue that counts.",author:"Winston Churchill",desc:"Former British Prime Minister",cat:"Success"},
  {text:"Happiness is not something ready made. It comes from your own actions.",author:"Dalai Lama",desc:"Spiritual Leader",cat:"Happiness"},
  {text:"The best time to plant a tree was 20 years ago. The second best time is now.",author:"Chinese Proverb",desc:"Ancient Wisdom",cat:"Wisdom"},
  {text:"An unexamined life is not worth living.",author:"Socrates",desc:"Greek Philosopher",cat:"Wisdom"},
  {text:"Spread love everywhere you go.",author:"Mother Teresa",desc:"Saint & Humanitarian",cat:"Happiness"},
  {text:"When you change the way you look at things, the things you look at change.",author:"Wayne Dyer",desc:"Author & Speaker",cat:"Wisdom"},
  {text:"I have not failed. I've just found 10,000 ways that won't work.",author:"Thomas A. Edison",desc:"Inventor",cat:"Success"},
  {text:"A person who never made a mistake never tried anything new.",author:"Albert Einstein",desc:"Theoretical Physicist",cat:"Courage"},
  {text:"The only impossible journey is the one you never begin.",author:"Tony Robbins",desc:"Motivational Speaker",cat:"Motivation"},
  {text:"In this life we cannot do great things. We can only do small things with great love.",author:"Mother Teresa",desc:"Saint & Humanitarian",cat:"Happiness"},
  {text:"Only a life lived for others is a life worthwhile.",author:"Albert Einstein",desc:"Theoretical Physicist",cat:"Life"},
  {text:"The purpose of our lives is to be happy.",author:"Dalai Lama",desc:"Spiritual Leader",cat:"Happiness"},
  {text:"You only live once, but if you do it right, once is enough.",author:"Mae West",desc:"Actress & Playwright",cat:"Life"},
  {text:"Live in the sunshine, swim the sea, drink the wild air.",author:"Ralph Waldo Emerson",desc:"Essayist & Philosopher",cat:"Happiness"},
  {text:"The mind is everything. What you think you become.",author:"Buddha",desc:"Spiritual Teacher",cat:"Wisdom"},
  {text:"Eighty percent of success is showing up.",author:"Woody Allen",desc:"Filmmaker",cat:"Success"},
  {text:"Your life does not get better by chance, it gets better by change.",author:"Jim Rohn",desc:"Entrepreneur & Author",cat:"Motivation"},
  {text:"Try to be a rainbow in someone's cloud.",author:"Maya Angelou",desc:"Poet & Civil Rights Activist",cat:"Happiness"},
  {text:"What lies behind us and what lies before us are tiny matters compared to what lies within us.",author:"Ralph Waldo Emerson",desc:"Essayist & Philosopher",cat:"Wisdom"},
  {text:"Start where you are. Use what you have. Do what you can.",author:"Arthur Ashe",desc:"Tennis Champion",cat:"Motivation"},
  {text:"Two roads diverged in a wood, and I — I took the one less traveled by.",author:"Robert Frost",desc:"Poet",cat:"Courage"},
];

let currentCat = 'all';
let filteredQuotes = [...QUOTES];
let currentIndex = 0;
let favorites = JSON.parse(localStorage.getItem('qf_favs')||'[]');
let usedIndices = [];

function getFiltered(){
  return currentCat==='all' ? QUOTES : QUOTES.filter(q=>q.cat===currentCat);
}

function filterCat(cat, btn){
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filteredQuotes = getFiltered();
  usedIndices = [];
  currentIndex = Math.floor(Math.random()*filteredQuotes.length);
  showQuote(currentIndex, true);
  buildDots();
  document.getElementById('total-count').textContent = filteredQuotes.length;
}

function catClass(cat){
  const map={Wisdom:'cat-wisdom',Motivation:'cat-motivation',Life:'cat-life',Success:'cat-success',Happiness:'cat-happiness',Courage:'cat-courage'};
  return map[cat]||'cat-wisdom';
}

function showQuote(idx, instant){
  const q = filteredQuotes[idx];
  const textEl = document.getElementById('quote-text');
  const catEl = document.getElementById('quote-cat');

  if(!instant) textEl.classList.add('hidden');

  setTimeout(()=>{
    textEl.textContent = '"'+q.text+'"';
    document.getElementById('author-name').textContent = q.author;
    document.getElementById('author-desc').textContent = q.desc;
    catEl.textContent = q.cat;
    catEl.className = 'category-pill '+catClass(q.cat);
    document.getElementById('quote-number').textContent = String(idx+1).padStart(2,'0')+' / '+filteredQuotes.length;
    updateFavBtn(q);
    if(!instant) textEl.classList.remove('hidden');
    updateDots(idx);
  }, instant?0:300);
}

function newQuote(){
  const btn = document.getElementById('btn-new');
  btn.classList.add('loading');
  btn.textContent = '...';

  // avoid repeats
  if(usedIndices.length >= filteredQuotes.length) usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random()*filteredQuotes.length); }
  while(usedIndices.includes(idx) && filteredQuotes.length > 1);
  usedIndices.push(idx);
  currentIndex = idx;

  setTimeout(()=>{
    showQuote(idx, false);
    btn.classList.remove('loading');
    btn.textContent = '✦ New Quote';
  }, 200);
}

function copyQuote(){
  const q = filteredQuotes[currentIndex];
  const text = `"${q.text}" — ${q.author}`;
  navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Copied!');
  });
}

function toggleFav(){
  const q = filteredQuotes[currentIndex];
  const key = q.text.slice(0,30);
  const idx = favorites.findIndex(f=>f.text.slice(0,30)===key);
  if(idx>-1){
    favorites.splice(idx,1);
    showToast('Removed from saved');
  } else {
    favorites.push(q);
    showToast('Quote saved! ★');
  }
  localStorage.setItem('qf_favs',JSON.stringify(favorites));
  updateFavBtn(q);
  updateFavCount();
  renderFavList();
}

function updateFavBtn(q){
  const btn = document.getElementById('btn-fav');
  const key = q.text.slice(0,30);
  const isSaved = favorites.some(f=>f.text.slice(0,30)===key);
  btn.textContent = isSaved ? '★ Saved' : '♡ Save';
  btn.classList.toggle('active', isSaved);
}

function updateFavCount(){
  document.getElementById('fav-count').textContent = favorites.length;
}

function toggleFavPanel(){
  const panel = document.getElementById('fav-panel');
  panel.classList.toggle('show');
  renderFavList();
}

function renderFavList(){
  const list = document.getElementById('fav-list');
  if(!favorites.length){
    list.innerHTML='<div class="fav-empty">No saved quotes yet. Hit ♡ to save!</div>';
    return;
  }
  list.innerHTML = favorites.map(f=>`
    <div class="fav-item">"${f.text}"<span>— ${f.author}</span></div>
  `).join('');
}

// Progress dots (show last 7)
function buildDots(){
  const dots = document.getElementById('progress-dots');
  const count = Math.min(filteredQuotes.length, 7);
  dots.innerHTML = Array.from({length:count},(_,i)=>`<div class="dot" onclick="jumpTo(${i})" id="dot-${i}"></div>`).join('');
}

function updateDots(idx){
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx%7));
}

function jumpTo(i){
  currentIndex = i;
  showQuote(i, false);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// Init
filteredQuotes = [...QUOTES];
currentIndex = Math.floor(Math.random()*QUOTES.length);
showQuote(currentIndex, true);
buildDots();
updateDots(currentIndex);
updateFavCount();
document.getElementById('total-count').textContent = QUOTES.length;
</script>
</body>
</html>
